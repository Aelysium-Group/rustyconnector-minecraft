buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = "https://repo.papermc.io/repository/maven-public/"}
    }
    dependencies {
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.4.2'
    }
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://repo.maven.apache.org/maven2/" }
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
        maven { url = "https://hub.spigotmc.org/nexus/content/groups/public/" }
        maven { url = "https://oss.sonatype.org/content/groups/public/" }
        maven { url = "https://s01.oss.sonatype.org/content/repositories/snapshots/" }
        maven { url = "https://maven.mrnavastar.me/snapshots/" }
        maven { url = "https://maven.mrnavastar.me/releases/" }
        maven { url = "https://repo.eclipse.org/content/groups/releases/" }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'com.gradleup.shadow'

    group = project.maven_group
    version = project.plugin_version

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    dependencies {
        implementation 'group.aelysium.rustyconnector:core:0.9.2-103'
        //implementation 'group.aelysium.rustyconnector:core:0.9.1'
    }
}

configurations {
    modules
    compile.extendsFrom(modules)
}

dependencies {
    modules project(':common')
    modules project(':serverCommon')
    modules project(':paper')
    modules project(':fabric')
    modules project(':velocity')
}