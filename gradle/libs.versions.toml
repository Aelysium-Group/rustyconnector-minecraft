# Version catalog — single source of truth for dependency + toolchain versions.

[versions]
# Aelysium
core             = "0.9.2-103"
declarative-yaml = "0.2.0"
# Kyori Adventure
adventure        = "4.24.0"
examination      = "1.3.0"
# Incendo Cloud (annotations released; platform integrations at beta)
cloud-annotations = "2.0.0"
cloud-velocity    = "2.0.0-beta.10"
cloud-paper       = "2.0.0-beta.15"
cloud-fabric      = "2.0.0-beta.10"
# Config / serialization
configurate      = "4.1.2"
snakeyaml        = "2.3"
# Misc
jnanoid          = "2.0.0"
bstats           = "3.1.0"
annotations      = "24.1.0"
# Platform APIs
velocity-api     = "3.3.0-SNAPSHOT"
paper-api        = "1.21.1-R0.1-SNAPSHOT"
# Fabric
minecraft        = "1.21.8"
yarn             = "1.21.8+build.1"
fabric-loader    = "0.17.2"
fabric-api       = "0.133.4+1.21.8"
# Build toolchain (loom 1.17 requires Gradle 9)
shadow           = "9.4.2"
loom             = "1.17.12"

[libraries]
core                        = { module = "group.aelysium.rustyconnector:core", version.ref = "core" }
declarative-yaml            = { module = "group.aelysium:declarative-yaml", version.ref = "declarative-yaml" }

adventure-api               = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-key               = { module = "net.kyori:adventure-key", version.ref = "adventure" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
examination-api             = { module = "net.kyori:examination-api", version.ref = "examination" }
examination-string          = { module = "net.kyori:examination-string", version.ref = "examination" }

cloud-annotations           = { module = "org.incendo:cloud-annotations", version.ref = "cloud-annotations" }
cloud-velocity              = { module = "org.incendo:cloud-velocity", version.ref = "cloud-velocity" }
cloud-paper                 = { module = "org.incendo:cloud-paper", version.ref = "cloud-paper" }
cloud-fabric                = { module = "org.incendo:cloud-fabric", version.ref = "cloud-fabric" }

configurate-core            = { module = "org.spongepowered:configurate-core", version.ref = "configurate" }
configurate-yaml            = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
snakeyaml                   = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }

jnanoid                     = { module = "com.aventrix.jnanoid:jnanoid", version.ref = "jnanoid" }
bstats-velocity             = { module = "org.bstats:bstats-velocity", version.ref = "bstats" }
annotations                 = { module = "org.jetbrains:annotations", version.ref = "annotations" }

velocity-api                = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
paper-api                   = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }

fabric-loader               = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api                  = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

shadow-plugin               = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
loom-plugin                 = { module = "net.fabricmc:fabric-loom", version.ref = "loom" }
